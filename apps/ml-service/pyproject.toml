[project]
name = "rideo-ml-service"
version = "0.1.0"
description = "Forecasting, anomaly detection, and business insight service for Rideo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pandas>=2.2,<3.0",
  "prophet>=1.1.6,<2.0",
  "scikit-learn>=1.6,<2.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
